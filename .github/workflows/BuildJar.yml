on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grim-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bukkit and Fabric JARs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Build and test
        env:
          GRIM_GIT_ORG: CatTeaA
          GRIM_GIT_REPO: Grim
        run: ./gradlew build

      - name: Upload Bukkit JARs
        uses: actions/upload-artifact@v4
        with:
          name: Grim-Bukkit-${{ github.sha }}
          path: bukkit/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload Fabric JARs
        uses: actions/upload-artifact@v4
        with:
          name: Grim-Fabric-${{ github.sha }}
          path: fabric/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30
